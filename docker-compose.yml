# 청년정책도우미 — 3컨테이너 통합 실행
#
#   web (nginx)  :5173 → 브라우저가 여는 곳. /api 는 api 로 프록시한다.
#   api (FastAPI):8000 → 정책 목록·지도·문서·대화 저장. 가볍고 빨리 뜬다.
#   ai  (FastAPI):9000 → FAISS 검색 + Solar 생성. 무겁고 늦게 뜬다.
#
# 사용법
#   cp .env.example .env      # UPSTAGE_API_KEY, VITE_KAKAO_MAP_KEY 입력
#   docker compose up --build
#
# 첫 이미지 빌드는 torch 설치 때문에 오래 걸릴 수 있다. 임베딩 모델 2GB는
# build가 아니라 ai 컨테이너의 첫 기동 때 받고, hf-models 볼륨에 캐시한다.

services:
  ai:
    build:
      context: .
      dockerfile: Dockerfile.ai
    image: youth-policy-ai:latest
    environment:
      UPSTAGE_API_KEY: ${UPSTAGE_API_KEY:-}
      UPSTAGE_MODEL: ${UPSTAGE_MODEL:-solar-pro3}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      # Codespaces 는 GPU 가 없다. fp16 은 CPU 에서 오히려 느리므로 끈다.
      EMBEDDING_DEVICE: cpu
      EMBEDDING_USE_FP16: "false"
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-4}
      HF_HOME: /models
      # easyocr 도 첫 사용 때 모델(약 100MB)을 내려받는다. 임베딩 모델과 같은
      # 볼륨에 캐시해 컨테이너를 다시 만들어도 재다운로드하지 않게 한다.
      EASYOCR_MODULE_PATH: /models/easyocr
    volumes:
      # 임베딩 모델 2GB + easyocr 모델 캐시.
      # 이게 없으면 컨테이너를 다시 만들 때마다 재다운로드한다.
      - hf-models:/models
    ports:
      - "9000:9000"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: youth-policy-api:latest
    environment:
      AI_SERVICE_URL: http://ai:9000
      DB_PATH: /data/app.db
    volumes:
      # 대화 이력·첨부 메타를 담은 SQLite. 컨테이너를 지워도 남는다.
      - api-data:/data
    ports:
      - "8000:8000"
    depends_on:
      # service_healthy 가 아니라 service_started 인 것이 의도적이다.
      # AI 가 모델을 읽는 동안(수 분) 기다리게 하면 정책 목록·지도까지 막힌다.
      # 챗봇만 그동안 503 과 안내 문구를 돌려주고, 나머지는 즉시 동작한다.
      ai:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        # VITE_* 는 빌드 시점에 번들에 박힌다. 키를 바꾸면 web 만 재빌드한다.
        VITE_KAKAO_MAP_KEY: ${VITE_KAKAO_MAP_KEY:-}
        VITE_API_BASE: /api
        VITE_USE_MOCK: "false"
    image: youth-policy-web:latest
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  hf-models:
  api-data:
