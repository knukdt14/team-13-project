server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 업로드 PDF 여러 장을 받아야 하므로 기본 1MB 제한을 올린다.
    client_max_body_size 32m;

    # /api 는 백엔드 컨테이너로 넘긴다. compose 네트워크에서 호스트 이름은
    # 서비스 이름(api)이 그대로 쓰인다.
    #
    # 참고: nginx 는 기동 시점에 api 의 IP 를 한 번만 해석한다. api 컨테이너만
    # 따로 재시작해 IP 가 바뀌면 502 가 날 수 있는데, `docker compose restart web`
    # 한 번이면 복구된다. (compose 전체를 재시작할 때는 문제되지 않는다.)
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 챗봇 SSE 스트리밍. 버퍼링을 끄지 않으면 토큰이 실시간으로 흐르지 않고
        # 답변이 끝난 뒤 한꺼번에 도착한다.
        proxy_buffering     off;
        proxy_cache         off;
        proxy_set_header    Connection "";
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
    }

    # React Router 새로고침 대응. 없는 경로는 index.html 로 넘겨 SPA 가 처리한다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
